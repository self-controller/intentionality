[package]
name = "intentionality"
version = "0.5.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No tauri-plugin-notification, deliberately: an OS notification must be
# structurally impossible, not merely configured off.
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }
rand = "0.8"
thiserror = "1"

[profile.release]
strip = true

[features]
# The tauri CLI enables this for production builds; without it the binary is
# a dev build that tries to load the Vite dev server. Build with
# `npm run tauri build`, not raw `cargo build --release`.
custom-protocol = ["tauri/custom-protocol"]
