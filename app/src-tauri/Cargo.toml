[package]
name = "intentionality"
version = "0.5.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri-plugin-notification was deliberately absent until 2026-08-29, on the
# rule that an OS notification should be structurally impossible rather than
# merely configured off. David reversed that to get the time-up checkpoint:
# a window inside GNOME is invisible until you look at it, and the whole point
# of the checkpoint is that it reaches you when you are not looking. Sends are
# Rust-side only (see notify.rs) and limited to two events: time is up, and a
# scheduled analysis landing.
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# The meeting note taker (2026-09-08) added three feature flags and no crates.
# It reaches OpenAI's transcription endpoint over the same plain HTTPS reqwest
# already uses for claude.rs -- "multipart" is the whole cost of uploading a WAV
# (it pulls mime_guess + unicase transitively; no new direct dependency).
# Audio capture shells out to pw-record (pipewire-utils, already installed) and
# slices its stdout in Rust, so "process"/"io-util" replace what would otherwise
# be an audio crate plus a system alsa/pulse dev dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "process", "io-util"] }
rand = "0.9"
thiserror = "1"
# Attached context files (2026-09-10). Four crates, which is a real departure
# from the note above -- the meeting note taker managed on feature flags alone.
# The reason is that every one of these replaces a hand-rolled parser reading
# attacker-supplied bytes, and this is the one part of the app where the input
# is chosen by whoever emailed you the file rather than by the user.
#
# Rust-side only, and none of them pull a C dependency or a system dev package:
# that is the bar, and it is why the obvious choices are not always taken.
#
# zip: Office files are ZIP archives of XML. default-features = false is the
#   point -- the defaults pull bzip2, which is C. "deflate" resolves to
#   flate2/zlib-rs plus zopfli, both pure Rust, and deflate is the only method
#   OOXML actually uses.
zip = { version = "8", default-features = false, features = ["deflate"] }
# quick-xml: reads the OOXML parts. A ~40-line tag stripper would have saved
#   this dependency and been wrong on entity edge cases and nested runs, on
#   input someone else chose.
quick-xml = "0.42"
# lopdf: page count and /Encrypt detection before a PDF is sent. A byte cap
#   does not bound page count and page count is what costs tokens; an encrypted
#   PDF fails at the far end with a message nobody can act on.
#   default-features = false drops rayon and chrono, neither of which a
#   validity check needs.
lopdf = { version = "0.45", default-features = false }
# imagesize: header-only dimensions, to refuse a pathological pixel count. The
#   `image` crate would decode the whole thing to answer the same question.
imagesize = "0.15"
# tauri-plugin-dialog: the native file picker. Driven from Rust, like
#   tauri-plugin-notification above, so it needs no capability entry and the
#   chosen paths never cross into the webview at all.
tauri-plugin-dialog = "2"

[profile.release]
strip = true
# Thin LTO with the default 16 codegen units (2026-09-24). Fat LTO with one
# unit made the final link a single-threaded re-optimisation of every crate
# and dominated the release build; thin keeps most of the win in parallel.
# No panic = "abort": a panic in a spawned task must stay that task's.
lto = "thin"
codegen-units = 16

[features]
# The tauri CLI enables this for production builds; without it the binary is
# a dev build that tries to load the Vite dev server. Build with
# `npm run tauri build`, not raw `cargo build --release`.
custom-protocol = ["tauri/custom-protocol"]
