[package]
name = "intentionality"
version = "0.5.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# OS notifications were deliberately absent until 2026-08-29, on the rule that
# one should be structurally impossible rather than merely configured off.
# David reversed that to get the time-up checkpoint: a window inside GNOME is
# invisible until you look at it, and the whole point of the checkpoint is
# that it reaches you when you are not looking. Sends are Rust-side only (see
# notify.rs) and limited to time being up and a check landing on its own.
#
# notify-rust directly, not tauri-plugin-notification (2026-10-27): the
# plugin calls notify-rust from a task on the async runtime, and with zbus's
# tokio feature on (overlay.rs) notify-rust's block_on panics there -- every
# notification since mid-October died that way. notify.rs sends from a plain
# thread instead. Already in the tree as the plugin's own dependency.
tauri = { version = "2", features = [] }
notify-rust = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
rand = "0.9"
thiserror = "1"
# The at-risk timer talks to its gnome-shell extension over the session bus
# (overlay.rs). zbus is pure Rust, no libdbus system package.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# StreamExt for the extension's signal streams (zbus re-exports futures-core
# only). Already in the tree as zbus's own dependency.
futures-util = { version = "0.3", default-features = false }

[profile.release]
strip = true
# Thin LTO with the default 16 codegen units (2026-09-24). Fat LTO with one
# unit made the final link a single-threaded re-optimisation of every crate
# and dominated the release build; thin keeps most of the win in parallel.
# No panic = "abort": a panic in a spawned task must stay that task's.
lto = "thin"
codegen-units = 16

[features]
# The tauri CLI enables this for production builds; without it the binary is
# a dev build that tries to load the Vite dev server. Build with
# `npm run tauri build`, not raw `cargo build --release`.
custom-protocol = ["tauri/custom-protocol"]
